<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>完整度训练与结果复核</title><style>
body{margin:24px;background:#101b2b;color:#eaf3ff;font:16px system-ui}a{color:#8edfc4}section{background:#1d2e46;border-radius:10px;padding:18px;margin:14px 0}.cards{display:flex;gap:14px;flex-wrap:wrap}.cards section{flex:1;min-width:240px}h2{margin:5px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #40516a}pre{white-space:pre-wrap}.bad{color:#ff9b9b}iframe{width:100%;height:900px;border:1px solid #40516a;border-radius:10px}svg{width:100%;background:#1d2e46}select{font:inherit;padding:6px}small{color:#a8bbd1}</style>
<h1>物体完整度：训练、验证与模型修改</h1><p>每5秒采样。C1 baseline 复用；修改由 validation 结果触发。总截止：<b>2026-11-01 05:17:35 UTC</b>。</p>
<div class="cards"><section><small>当前完整度实验</small><h2 id="primary">读取中</h2><p id="iter"></p><p id="updated"></p><a href="../integrity_tuning/monitor.html">完整度详细监控</a></section><section><small>结果复核与后续模型</small><h2 id="feedback">等待数据</h2><p id="review"></p><a href="../integrity_feedback/monitor.html">修改记录与反馈实验</a></section><section><small>Object ID 实验</small><h2 id="object">读取中</h2><a href="../object_id/monitor.html">Object ID 结果</a><p id="clock"></p></section></div>
<section id="error" hidden class="bad"></section><section><h2>验证曲线</h2><p><select id="metric"><option value="PSNR">PSNR ↑</option><option value="SSIM">SSIM ↑</option><option value="LPIPS">LPIPS ↓</option><option value="MS-SSIM">MS-SSIM ↑</option><option value="integrity_score">完整度误差 ↓</option><option value="core_low_50">内部低覆盖 alpha&lt;0.5 ↓</option><option value="core_low_90">内部低覆盖 alpha&lt;0.9 ↓</option><option value="fragment_loss">投影碎裂/缺失 ↓</option><option value="opaque_appearance_error">高 alpha 颜色误差 ↓</option><option value="background_false_coverage">背景误覆盖 ↓</option></select> <small>横轴 iter；完整度各项为2D诊断比例，不代表3D闭合性。</small></p><svg id="curve" viewBox="0 0 1100 320"></svg><p id="legend"></p></section>
<section><h2>为什么修改</h2><pre id="proposal">四组20k筛选完成后，根据验证结果生成修改方案；保留原模型与修改理由。</pre></section>
<iframe id="details" title="当前训练详细监控" src="../integrity_tuning/monitor.html"></iframe>
<script>
let latestParent=null,latestFeedback=null;const colors=['#86d1ff','#8de4b1','#ffbe83','#e9a0ee','#cccccc','#ff8398','#b7ff83'];
const el=id=>document.getElementById(id);async function get(path){try{const r=await fetch(path,{cache:'no-store'});return r.ok?await r.json():null}catch{return null}}
function plot(){const field=el('metric').value,series=[...(latestParent?.rows||[]),...(latestFeedback?.rows||[])].filter(r=>r.history?.length),values=[];for(const r of series)for(const h of r.history){const y=h.metrics?.[field]??h.integrity?.[field];if(Number.isFinite(y))values.push(y)}
 if(!values.length){el('curve').innerHTML='<text x="40" y="80" fill="white">等待首次正式 validation；预检进度见下方页面。</text>';return}const lo=Math.min(...values),hi=Math.max(...values),span=Math.max(hi-lo,1e-8);let svg=`<text x="8" y="20" fill="white">${hi.toFixed(6)}</text><text x="8" y="265" fill="white">${lo.toFixed(6)}</text><text x="90" y="300" fill="white">0</text><text x="990" y="300" fill="white">50,000 iter</text>`;
series.forEach((r,k)=>{const c=colors[k%colors.length],p=r.history.map(h=>[90+940*h.iteration/50000,265-230*((h.metrics?.[field]??h.integrity?.[field])-lo)/span]).filter(p=>p.every(Number.isFinite));svg+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${p.map(p=>p.join(',')).join(' ')}"/>`+p.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="${c}"/>`).join('')});el('curve').innerHTML=svg;el('legend').textContent=series.map(r=>r.id).join(' | ')}
async function refresh(){const [p,f,o,proposals]=await Promise.all([get('../integrity_tuning/results.json'),get('../integrity_feedback/results.json'),get('../object_id/results.json'),get('../integrity_feedback/proposals.json')]);latestParent=p;latestFeedback=f;
el('primary').textContent=p?.controller?.status||'等待启动';el('iter').textContent=p?.active?`${p.active.id} | ${p.active_progress?.iteration??0} / ${p.active_progress?.target??50000} iter`:'';el('updated').textContent=p?'更新时间 UTC：'+p.updated_utc:'';
el('feedback').textContent=f?.controller?.status||'等待启动';el('review').textContent=f?.reviews?.length?`${f.reviews[0].model} / ${f.reviews[0].iteration} iter，PSNR 相对同 iter C1：${f.reviews[0].PSNR_delta_at_matched_iteration?.toFixed(4)} dB`:'监测当前验证结果';el('object').textContent=o?.controller?.status||'等待数据';
const errors=[p?.controller?.error,f?.controller?.error].filter(Boolean);el('error').hidden=!errors.length;el('error').textContent=errors.join('\n');if(proposals)el('proposal').textContent=Object.entries(proposals).map(([n,v])=>n+' / '+v.action+'\n'+v.reasons.join('\n')+'\n参数：'+JSON.stringify(v.knobs||{})).join('\n\n');
const phase=f?.controller?.status||'',ownActive=/^feedback_/.test(phase),src=ownActive?'../integrity_feedback/monitor.html':'../integrity_tuning/monitor.html';if(ownActive){el('primary').textContent=phase;el('iter').textContent=`${f.active?.id||'preflight'} | ${f.active_progress?.iteration??0} / ${f.active_progress?.target??50000} iter`;el('updated').textContent='更新时间 UTC：'+f.updated_utc}if(el('details').getAttribute('src')!==src)el('details').src=src;plot()}
function clock(){let s=Math.max(0,Math.floor((Date.parse('2026-11-01T05:17:35Z')-Date.now())/1000));el('clock').textContent='预算剩余 '+Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'}el('metric').onchange=plot;refresh();clock();setInterval(refresh,5000);setInterval(clock,1000);
</script></html>
